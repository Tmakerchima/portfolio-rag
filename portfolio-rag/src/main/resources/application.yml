server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
    username: postgres.odzmchhqdukwhcjccdxt
    password: ${SUPABASE_DB_PASSWORD}
  ai:
    openai:
      # DashScope OpenAI 兼容模式入口
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.2
          max-tokens: 500
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
    mcp:
      client:
        # 由 AgentToolProvider 主动发现工具；失败不会拖垮应用，并会在后续请求中重试。
        initialized: false
        streamable-http:
          connections:
            github:
              # GitHub 官方远程托管 MCP Server
              url: https://api.githubcopilot.com/mcp/

# 自定义配置：简历知识库路径
portfolio:
  knowledge-path: classpath:knowledge/**/*
  rag:
    # 入库时按 Markdown 标题语义切块；在线先扩大向量召回，再做 metadata + lexical 本地重排。
    max-chunk-chars: 1800
    vector-top-k: 10
    final-top-k: 3
    # 短问题（如"毕业于哪个学校"）向量相似度往往偏低且扎堆，0.35 会把真正相关的片段过滤掉，
    # 导致"问教育却召回技术栈"。降到 0.25 后召回更充分，排序交给意图加权 + 词法重排。
    similarity-threshold: 0.25
    max-context-chars: 2800
    # 小语料全量上下文：整个知识库字符数不超过该值时，不检索而是把全部片段喂给 LLM。
    # 当前简历约 6600 字符，因此线上走全量；知识库扩大后自动回退到混合检索。设 0 可关闭。
    full-context-max-chars: 8000

# EnterpriseRAG uses separate enterprise_* tables and is never ingested at startup.
# Apply the additive migration in db/migration manually before enabling production ingestion.
enterprise:
  rag:
    enabled: ${ENTERPRISE_RAG_ENABLED:true}
    # This is only a bounded HTTP canary guard. Full corpus loads use eval/enterprise_rag_worker.py.
    max-documents: ${ENTERPRISE_RAG_MAX_DOCUMENTS:1000}
    max-chunk-tokens: ${ENTERPRISE_RAG_MAX_CHUNK_TOKENS:700}
    chunk-overlap-tokens: ${ENTERPRISE_RAG_CHUNK_OVERLAP_TOKENS:80}
    vector-top-k: ${ENTERPRISE_RAG_VECTOR_TOP_K:12}
    keyword-top-k: ${ENTERPRISE_RAG_KEYWORD_TOP_K:12}
    final-top-k: ${ENTERPRISE_RAG_FINAL_TOP_K:5}
    rrf-k: ${ENTERPRISE_RAG_RRF_K:60}
    max-context-chars: ${ENTERPRISE_RAG_MAX_CONTEXT_CHARS:9000}
    similarity-threshold: ${ENTERPRISE_RAG_SIMILARITY_THRESHOLD:0.20}
    strategy: ${ENTERPRISE_RAG_STRATEGY:HYBRID}
    rerank-enabled: ${ENTERPRISE_RAG_RERANK_ENABLED:true}
    # lexical 是可切换的抽象：默认保持旧 PostgreSQL FTS，生产可切换为真正 ParadeDB BM25。
    lexical:
      backend: ${ENTERPRISE_RAG_LEXICAL_BACKEND:POSTGRES_FTS}
      # true 表示 BM25 连接/查询失败时回退 FTS；false 表示让请求明确失败，便于严格发现配置问题。
      fail-open: ${ENTERPRISE_RAG_LEXICAL_FAIL_OPEN:true}
    bm25:
      # 这是 ParadeDB 搜索副本的独立 JDBC URL，不要填 Supabase 主库 URL。
      url: ${ENTERPRISE_RAG_BM25_URL:}
      username: ${ENTERPRISE_RAG_BM25_USERNAME:}
      # 密码只从操作系统环境变量或 secret manager 注入，禁止把真实值写入 yml。
      password: ${ENTERPRISE_RAG_BM25_PASSWORD:}
      top-k: ${ENTERPRISE_RAG_BM25_TOP_K:20}
      connect-timeout-ms: ${ENTERPRISE_RAG_BM25_CONNECT_TIMEOUT_MS:1000}
      query-timeout-ms: ${ENTERPRISE_RAG_BM25_QUERY_TIMEOUT_MS:3000}
      max-retries: ${ENTERPRISE_RAG_BM25_MAX_RETRIES:0}
    reranker:
      # HEURISTIC changes ranking without another API call; LLM enables listwise model reranking.
      mode: ${ENTERPRISE_RAG_RERANKER_MODE:HEURISTIC}
      max-candidates: ${ENTERPRISE_RAG_RERANKER_MAX_CANDIDATES:30}
      max-chars-per-candidate: ${ENTERPRISE_RAG_RERANKER_MAX_CHARS:1600}
    contextual:
      # Explicit opt-in: enabling this makes one chat-model request per new/changed chunk.
      enabled: ${ENTERPRISE_RAG_CONTEXTUAL_ENABLED:false}
      fail-open: ${ENTERPRISE_RAG_CONTEXTUAL_FAIL_OPEN:false}
      max-document-chars: ${ENTERPRISE_RAG_CONTEXTUAL_MAX_DOCUMENT_CHARS:60000}
      max-prefix-chars: ${ENTERPRISE_RAG_CONTEXTUAL_MAX_PREFIX_CHARS:800}
    agentic:
      # Optional second-pass query planning; rewritten queries always reuse server-side ACL context.
      enabled: ${ENTERPRISE_RAG_AGENTIC_ENABLED:false}
      max-rewritten-queries: ${ENTERPRISE_RAG_AGENTIC_MAX_QUERIES:2}
      min-initial-hits: ${ENTERPRISE_RAG_AGENTIC_MIN_INITIAL_HITS:3}
      long-query-chars: ${ENTERPRISE_RAG_AGENTIC_LONG_QUERY_CHARS:180}
      snippet-chars: ${ENTERPRISE_RAG_AGENTIC_SNIPPET_CHARS:500}
    # Spring 会先读取操作系统环境变量 ENTERPRISE_RAG_ADMIN_TOKEN；最后的 : 表示未设置时使用空字符串。
    # 空字符串会关闭管理接口。生产环境不要把真实密钥直接写进这个会提交到 Git 的文件。
    admin-token: ${ENTERPRISE_RAG_ADMIN_TOKEN:}
    vector-backend: ${ENTERPRISE_RAG_VECTOR_BACKEND:PGVECTOR}
    active-corpus-id: ${ENTERPRISE_RAG_ACTIVE_CORPUS_ID:}
    embedding-model: ${ENTERPRISE_RAG_EMBEDDING_MODEL:text-embedding-v3}
    embedding-dimensions: ${ENTERPRISE_RAG_EMBEDDING_DIMENSIONS:1024}
    worker-batch-size: ${ENTERPRISE_RAG_WORKER_BATCH_SIZE:10}
    worker-concurrency: ${ENTERPRISE_RAG_WORKER_CONCURRENCY:1}
    max-retries: ${ENTERPRISE_RAG_MAX_RETRIES:5}

github:
  mcp-pat: ${GITHUB_MCP_PAT}

logging:
  level:
    com.mac.portfolio: DEBUG
    org.springframework.ai: INFO
