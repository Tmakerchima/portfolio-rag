server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
    username: postgres.odzmchhqdukwhcjccdxt
    password: ${SUPABASE_DB_PASSWORD}
  ai:
    openai:
      # DashScope OpenAI 兼容模式入口
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
    mcp:
      client:
        # 不在 Spring 自动配置阶段就同步握手——GitHub 远程 MCP 偶发慢/超时，
        # 放在这里会直接拖垮整个应用启动（RAG/Function Calling 也一起挂掉）。
        # 改成懒加载，真正的握手延后到 AiConfig 里手动获取工具列表时，由我们自己 try-catch 兜底
        initialized: false
        streamable-http:
          connections:
            github:
              # GitHub 官方远程托管 MCP Server
              url: https://api.githubcopilot.com/mcp/

# 自定义配置：简历知识库路径
portfolio:
  knowledge-path: classpath:knowledge/**/*

github:
  mcp-pat: ${GITHUB_MCP_PAT}

logging:
  level:
    com.mac.portfolio: DEBUG
    org.springframework.ai: INFO
