server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
    username: postgres.odzmchhqdukwhcjccdxt
    password: ${SUPABASE_DB_PASSWORD}
  ai:
    openai:
      # DashScope OpenAI 兼容模式入口
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.2
          max-tokens: 500
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
    mcp:
      client:
        # 由 AgentToolProvider 主动发现工具；失败不会拖垮应用，并会在后续请求中重试。
        initialized: false
        streamable-http:
          connections:
            github:
              # GitHub 官方远程托管 MCP Server
              url: https://api.githubcopilot.com/mcp/

# 自定义配置：简历知识库路径
portfolio:
  knowledge-path: classpath:knowledge/**/*
  rag:
    # 入库时按 Markdown 标题语义切块；在线先扩大向量召回，再做 metadata + lexical 本地重排。
    max-chunk-chars: 1800
    vector-top-k: 10
    final-top-k: 3
    similarity-threshold: 0.35
    max-context-chars: 2800

github:
  mcp-pat: ${GITHUB_MCP_PAT}

logging:
  level:
    com.mac.portfolio: DEBUG
    org.springframework.ai: INFO
