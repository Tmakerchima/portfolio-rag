<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角洲问答助手</title>
  <style>
    :root {
      --bg: #0f1115;
      --sidebar-bg: #161920;
      --card: #1e2128;
      --line: #262c38;
      --fg: #e6e9ef;
      --mut: #7a8499;
      --acc: #e8b13a;
      --acc2: #3a7bd5;
      --user-bg: #17251c;
      --user-border: #253d2c;
      --user-fg: #c8edce;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.7 -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 230px;
      min-width: 230px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-top {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
    }
    .new-btn {
      width: 100%;
      background: var(--acc2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background .15s;
    }
    .new-btn:hover { background: #2d6bc4; }
    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }
    .conv-list::-webkit-scrollbar { width: 4px; }
    .conv-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
    .conv-item {
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      color: var(--mut);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      user-select: none;
    }
    .conv-item:hover { background: var(--card); color: var(--fg); }
    .conv-item.active { background: var(--card); color: var(--fg); }
    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--mut);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--mut);
      padding: 32px 24px;
    }
    .empty-icon { font-size: 40px; }
    .empty-title { font-size: 20px; color: var(--fg); font-weight: 600; }
    .empty-sub { font-size: 13px; margin-bottom: 8px; }
    .suggestions { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 480px; }
    .suggestion {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 13px;
      font: inherit;
      cursor: pointer;
      color: var(--fg);
      text-align: left;
      transition: border-color .15s;
    }
    .suggestion:hover { border-color: var(--acc2); color: var(--acc2); }

    /* Message row */
    .msg-row {
      padding: 4px 24px;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg-label {
      font-size: 12px;
      color: var(--mut);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .label-tag {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
    }
    .msg-row.user .label-tag { background: var(--user-bg); border-color: var(--user-border); color: var(--user-fg); }

    /* Bubble */
    .bubble {
      display: inline-block;
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 10px;
      word-break: break-word;
      line-height: 1.65;
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--user-fg);
      white-space: pre-wrap;
    }
    .msg-row.assistant .bubble {
      background: var(--card);
      border: 1px solid var(--line);
      white-space: pre-wrap;
    }
    .bubble b { color: var(--acc); }
    .bubble a { color: var(--acc2); word-break: break-all; }
    .bubble .shot { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; display: block; }

    .copy-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--mut);
      border-radius: 5px;
      font-size: 11px;
      padding: 1px 7px;
      cursor: pointer;
      margin-left: 4px;
    }
    .copy-btn:hover { color: var(--fg); border-color: var(--fg); }

    .thinking-row {
      padding: 6px 24px;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      color: var(--mut);
      font-size: 13px;
    }

    /* ── Input ── */
    .input-area {
      padding: 12px 24px 20px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .input-box {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      transition: border-color .15s;
    }
    .input-box:focus-within { border-color: var(--acc2); }
    .input-box textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      resize: none;
      line-height: 1.6;
      max-height: 180px;
      padding: 2px 0;
    }
    .input-box textarea::placeholder { color: var(--mut); }
    .send-btn {
      background: var(--acc2);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      transition: background .15s;
    }
    .send-btn:hover:not(:disabled) { background: #2d6bc4; }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }
    .input-hint { font-size: 12px; color: var(--mut); margin-top: 6px; text-align: center; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .sidebar { display: none; }
      .msg-row, .thinking-row { padding: 4px 12px; }
      .input-area { padding: 10px 12px 16px; }
      .bubble { max-width: 95%; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-top">
    <button class="new-btn" onclick="newChat()">✏ 新建对话</button>
  </div>
  <div class="conv-list" id="convList"></div>
  <div class="sidebar-footer">三角洲问答助手</div>
</aside>

<!-- Main -->
<div class="main">
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-box">
      <textarea id="q" rows="1"
        placeholder="问我任何关于三角洲的问题…"
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" title="发送 (Ctrl+Enter)">▶</button>
    </div>
    <div class="input-hint">Ctrl+Enter 发送 · 数据来自数据帝实时行情</div>
  </div>
</div>

<script src="config.js"></script>
<script>
// ── API base ──
const API = ((window.API_BASE || location.origin).replace(/\/+$/, '')) + '/api';

// ── Storage ──
let convs = JSON.parse(localStorage.getItem('df_convs') || '[]');
let curId = null;

function save() { localStorage.setItem('df_convs', JSON.stringify(convs)); }
function getConv(id) { return convs.find(c => c.id === id); }

// ── Markdown ──
function fmt(s) {
  let e = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  e = e.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  e = e.replace(/https?:\/\/[^\s）)]+\.(?:png|jpg|jpeg|webp|gif)/gi,
                u => '<br><img class="shot" src="' + u + '" loading="lazy"><br>');
  e = e.replace(/(https?:\/\/[^\s<）)]+)(?![^<]*>)/g,
                u => '<a href="' + u + '" target="_blank">' + u + '</a>');
  return e;
}

// ── Render ──
function showEmpty() {
  const el = document.getElementById('messages');
  el.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🎮</div>
      <div class="empty-title">三角洲问答助手</div>
      <div class="empty-sub">实时行情 · 配装建议 · 改枪码</div>
      <div class="suggestions">
        <button class="suggestion" onclick="fillSend('我有500万哈夫币，今天买什么子弹划算？')">我有500万哈夫币，今天买什么子弹划算？</button>
        <button class="suggestion" onclick="fillSend('帮我配绝密航天卡战备，要改枪码')">帮我配绝密航天卡战备，要改枪码</button>
        <button class="suggestion" onclick="fillSend('机密大坝凑战备，预算150万')">机密大坝凑战备，预算150万</button>
        <button class="suggestion" onclick="fillSend('绝密巴克什跑刀，给改枪码')">绝密巴克什跑刀，给改枪码</button>
      </div>
    </div>`;
}

function renderMessages(conv) {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  if (!conv || conv.msgs.length === 0) { showEmpty(); return; }
  for (const m of conv.msgs) appendRow(m.role, m.text, false);
  el.scrollTop = el.scrollHeight;
}

function appendRow(role, text, scroll) {
  const el = document.getElementById('messages');
  const es = el.querySelector('.empty-state');
  if (es) es.remove();

  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const label = document.createElement('div');
  label.className = 'msg-label';
  const tag = document.createElement('span');
  tag.className = 'label-tag';
  tag.textContent = role === 'user' ? '你' : '助手';
  label.appendChild(tag);
  if (role === 'assistant') {
    const cp = document.createElement('button');
    cp.className = 'copy-btn';
    cp.textContent = '复制';
    cp.onclick = () => { navigator.clipboard.writeText(text); cp.textContent = '已复制'; setTimeout(() => cp.textContent = '复制', 1300); };
    label.appendChild(cp);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = fmt(text);

  row.appendChild(label);
  row.appendChild(bubble);
  el.appendChild(row);
  if (scroll) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  return { bubble, row };
}

// ── Sidebar ──
function renderSidebar() {
  const list = document.getElementById('convList');
  list.innerHTML = '';
  for (let i = convs.length - 1; i >= 0; i--) {
    const c = convs[i];
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === curId ? ' active' : '');
    item.textContent = c.title || '新对话';
    item.title = c.title || '新对话';
    item.onclick = () => loadConv(c.id);
    list.appendChild(item);
  }
}

function loadConv(id) {
  curId = id;
  renderSidebar();
  renderMessages(getConv(id));
}

function newChat() {
  const id = Date.now().toString();
  convs.push({ id, title: '新对话', msgs: [] });
  save();
  loadConv(id);
  setTimeout(() => document.getElementById('q').focus(), 50);
}

// ── Send ──
async function send() {
  const qa = document.getElementById('q');
  const text = qa.value.trim();
  if (!text) return;

  if (!curId) newChat();
  const conv = getConv(curId);

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  qa.value = '';
  qa.style.height = '';

  conv.msgs.push({ role: 'user', text });
  if (conv.title === '新对话') conv.title = text.length > 18 ? text.slice(0, 18) + '…' : text;
  save();

  appendRow('user', text, true);
  renderSidebar();

  const el = document.getElementById('messages');
  const thinkRow = document.createElement('div');
  thinkRow.className = 'thinking-row';
  thinkRow.textContent = '思考中…';
  el.appendChild(thinkRow);
  thinkRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  let accText = '';
  let bubbleEl = null;
  let copyBtn = null;

  const render = () => {
    if (thinkRow.parentNode) thinkRow.remove();
    if (!bubbleEl) {
      const { bubble, row } = appendRow('assistant', '', true);
      bubbleEl = bubble;
      copyBtn = row.querySelector('.copy-btn');
    }
    bubbleEl.innerHTML = fmt(accText);
    bubbleEl.closest('.msg-row').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  try {
    const resp = await fetch(API + '/ask-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text })
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = 'message', data = '';
        for (const ln of frame.split('\n')) {
          if (ln.startsWith('event:')) ev = ln.slice(6).trim();
          else if (ln.startsWith('data:')) data += ln.slice(5);
        }
        if (ev !== 'done' && data) { accText += data; render(); }
      }
    }
    if (!bubbleEl) appendRow('assistant', accText || '（无内容）', true);
    if (copyBtn) copyBtn.onclick = () => { navigator.clipboard.writeText(accText); copyBtn.textContent = '已复制'; setTimeout(() => copyBtn.textContent = '复制', 1300); };
    conv.msgs.push({ role: 'assistant', text: accText });
    save();
  } catch (e) {
    if (thinkRow.parentNode) thinkRow.remove();
    const errText = '请求失败：' + e;
    appendRow('assistant', errText, true);
    conv.msgs.push({ role: 'assistant', text: errText });
    save();
  }

  btn.disabled = false;
  qa.focus();
}

function fillSend(text) {
  document.getElementById('q').value = text;
  send();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

document.getElementById('q').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); send(); }
});

// ── Init ──
(function () {
  if (convs.length === 0) {
    newChat();
  } else {
    loadConv(convs[convs.length - 1].id);
  }
})();
</script>
</body>
</html>
